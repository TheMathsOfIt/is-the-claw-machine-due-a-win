<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is the claw machine due a win?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@400;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f6f4,#101010);--ink:light-dark(#141414,#f5f5f5);--muted:light-dark(#62676e,#8b919a);--line:light-dark(#dcdcd8,#262626);--blue:light-dark(#0a7bb0,#38bdf8);--gold:light-dark(#9a7100,#facc15);--grey:light-dark(#9aa0a6,#5b6068)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
main{max-width:880px;margin:0 auto;padding:clamp(28px,5vw,64px) max(5vw,18px)}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:600 clamp(30px,4.4vw,44px)/1.1 "STIX Two Text",Georgia,serif;margin:6px 0 28px;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;border-radius:999px;background:none;color:var(--muted);min-height:38px;padding:0 16px;font:500 15px Inter,system-ui,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chart{position:relative;width:100%;aspect-ratio:16/9;margin-top:24px}
.chart canvas{position:absolute;inset:0;width:100%;height:100%}
.answer{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.big{font:400 clamp(64px,10vw,104px)/.9 "STIX Two Text",Georgia,serif;color:var(--gold);font-variant-numeric:tabular-nums}
.cap{color:var(--muted);margin-top:8px}
.ctl{flex:1 1 280px;max-width:420px}
label{display:flex;justify-content:space-between;font-weight:500;font-size:15px}
label b{font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:36px;margin:0;accent-color:var(--blue)}
details{margin-top:28px;border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;color:var(--muted);font-size:15px}
.sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:14px}
.play{margin-top:28px;border-top:1px solid var(--line);padding-top:24px;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px}
button.go{min-height:46px;padding:0 22px;border-radius:999px;border:0;background:var(--blue);color:#06131b;font:600 16px Inter,system-ui,sans-serif;cursor:pointer}
button.go:active{transform:translateY(1px)}
.tally{font-variant-numeric:tabular-nums;color:var(--muted)}
.tally b{color:var(--ink);font-weight:600}
.dots{display:flex;flex-wrap:wrap;gap:5px;width:100%}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--grey);opacity:.45}
.dots i.w{background:var(--gold);opacity:1}
.peek{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;cursor:pointer}
.peek input{accent-color:var(--blue);width:18px;height:18px}
#inside b{color:var(--ink)}
footer{margin-top:40px;font-size:14px;color:var(--muted)}
a{color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media(max-width:620px){.sets{grid-template-columns:minmax(0,1fr)}.chart{aspect-ratio:4/3}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">The Maths Of It · Episode 2</div>
  <h1>Is the claw machine due a win?</h1>

  <div class="seg" role="group" aria-label="Machine">
    <button id="mReg" aria-pressed="true">Payout counter</button>
    <button id="mFix" aria-pressed="false">Fixed odds</button>
  </div>

  <div class="chart"><canvas id="chart" role="img" aria-label="Chance the next go wins, by losses in a row"></canvas></div>

  <div class="answer" aria-live="polite">
    <div><div class="big" id="hz">39%</div><div class="cap" id="cap">chance the next go wins</div></div>
    <div class="ctl"><label for="k">Losses in a row <b id="kv">9</b></label><input id="k" type="range" min="0" max="20" value="9"></div>
  </div>

  <details>
    <summary>Machine settings</summary>
    <div class="sets">
      <div><label for="ev">Plays per prize <b id="evv">10</b></label><input id="ev" type="range" min="2" max="40" value="10"></div>
      <div id="g1"><label for="st">Strong grip wins <b id="stv">50%</b></label><input id="st" type="range" min="5" max="100" value="50"></div>
      <div id="g2"><label for="wk">Weak grip wins <b id="wkv">2%</b></label><input id="wk" type="range" min="0" max="20" value="2"></div>
    </div>
  </details>

  <div class="play">
    <button class="go" id="p1">Play £1</button>
    <span class="tally"><b id="sSpent">£0</b> spent · <b id="sWon">0</b> <span id="pz">prizes</span> · <b id="sRun">0</b> losses in a row</span>
    <div class="dots" id="dots" aria-hidden="true"></div>
    <label class="peek"><input type="checkbox" id="pk"> Peek inside</label>
    <span class="tally" id="inside" hidden></span>
  </div>

  <footer>Simulated over 2 million goes. Grip chances are guesses. <a href="https://github.com/TheMathsOfIt/is-the-claw-machine-due-a-win">Code on GitHub</a></footer>
</main>
<script>
{
const $=id=>document.getElementById(id);
const S={mode:'reg',every:10,strong:.5,weak:.02,k:9};
let H=null;
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
// payout counter: one prize owed every `every` plays; strong grip while a prize is owed
function hazard(n,every,strong,weak){
  const r=rng(7),hits=new Float64Array(21),cnt=new Float64Array(21);let P=0,c=every,k=0;
  for(let i=0;i<n;i++){if(--c===0){P++;c=every;}const w=r()<(P>0?strong:weak);if(w)P--;
    if(k<=20){cnt[k]++;if(w)hits[k]++;}k=w?0:k+1;}
  return Array.from(cnt,(c,j)=>c>=300?hits[j]/c:NaN);}
const pct=v=>isNaN(v)?'–':(v*100).toFixed(v<.1?1:0)+'%';
function run(){H=hazard(2e6,S.every,S.strong,S.weak);show();}
function cur(){return S.mode==='reg'?H:H.map(()=>1/S.every);}
function show(){const v=cur()[S.k];$('hz').textContent=pct(v);$('kv').textContent=S.k;draw();}
// chart
const cv=$('chart'),ctx=cv.getContext('2d'),probe=document.createElement('i');probe.hidden=true;document.body.append(probe);
const col=v=>(probe.style.color=`var(${v})`,getComputedStyle(probe).color);
function draw(){if(!H)return;const w=cv.clientWidth,h=cv.clientHeight,d=devicePixelRatio||1;cv.width=w*d;cv.height=h*d;ctx.setTransform(d,0,0,d,0,0);
  const L=40,Rr=8,T=8,B=28,pw=w-L-Rr,ph=h-T-B,hs=cur(),fp=1/S.every;
  let top=Math.max(fp,...H.filter(v=>!isNaN(v)));top=Math.max(.1,Math.ceil(top*1.1*10)/10);
  const X=k=>L+k/20*pw,Y=v=>T+ph-v/top*ph,mut=col('--muted'),line=col('--line');
  ctx.font='12px Inter,system-ui,sans-serif';ctx.fillStyle=mut;ctx.strokeStyle=line;ctx.lineWidth=1;ctx.textAlign='right';ctx.textBaseline='middle';
  for(let v=0;v<=top+1e-9;v+=top>.5?.2:.1){ctx.beginPath();ctx.moveTo(L,Y(v));ctx.lineTo(L+pw,Y(v));ctx.stroke();ctx.fillText(Math.round(v*100)+'%',L-8,Y(v));}
  ctx.textAlign='center';ctx.textBaseline='top';for(let k=0;k<=20;k+=5)ctx.fillText(k,X(k),T+ph+8);
  if(S.mode==='reg'){ctx.setLineDash([5,5]);ctx.strokeStyle=col('--grey');ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(X(0),Y(fp));ctx.lineTo(X(20),Y(fp));ctx.stroke();ctx.setLineDash([]);}
  ctx.strokeStyle=col('--blue');ctx.lineWidth=3;ctx.lineJoin='round';ctx.beginPath();let on=false;
  hs.forEach((v,k)=>{if(isNaN(v)){on=false;return;}on?ctx.lineTo(X(k),Y(v)):ctx.moveTo(X(k),Y(v));on=true;});ctx.stroke();
  const sv=hs[S.k];if(!isNaN(sv)){ctx.fillStyle=col('--gold');ctx.beginPath();ctx.arc(X(S.k),Y(sv),6,0,7);ctx.fill();}}
new ResizeObserver(draw).observe(cv);matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
// play
const G={r:rng(Date.now()%1e9)};
function reset(){Object.assign(G,{P:0,c:S.every,spent:0,won:0,run:0,hist:[]});render();}
function play(){let w;if(S.mode==='fix')w=G.r()<1/S.every;else{if(--G.c<=0){G.P++;G.c=S.every;}w=G.r()<(G.P>0?S.strong:S.weak);if(w)G.P--;}
  G.spent++;G.hist.push(w);if(G.hist.length>60)G.hist.shift();if(w){G.won++;G.run=0;}else G.run++;render();}
function render(){$('sSpent').textContent='£'+G.spent;$('sWon').textContent=G.won;$('pz').textContent=G.won===1?'prize':'prizes';$('sRun').textContent=G.run;
  $('dots').replaceChildren(...G.hist.map(w=>{const i=document.createElement('i');if(w)i.className='w';return i;}));
  const ins=$('inside');ins.hidden=!$('pk').checked;
  ins.innerHTML=S.mode==='fix'?`Every go: <b>${pct(1/S.every)}</b>`:`Prizes owed <b>${G.P}</b> · grip <b>${G.P>0?'strong':'weak'}</b>`;}
// controls
function setMode(m){S.mode=m;$('mReg').setAttribute('aria-pressed',m==='reg');$('mFix').setAttribute('aria-pressed',m==='fix');
  for(const id of ['g1','g2'])$(id).style.opacity=m==='fix'?.4:1;reset();show();}
$('mReg').onclick=()=>setMode('reg');$('mFix').onclick=()=>setMode('fix');
$('k').oninput=e=>{S.k=+e.target.value;show();};
let tm;const later=()=>{clearTimeout(tm);tm=setTimeout(()=>{run();reset();},120);};
$('ev').oninput=e=>{S.every=+e.target.value;$('evv').textContent=S.every;later();};
$('st').oninput=e=>{S.strong=e.target.value/100;$('stv').textContent=e.target.value+'%';later();};
$('wk').oninput=e=>{S.weak=e.target.value/100;$('wkv').textContent=e.target.value+'%';later();};
$('p1').onclick=play;$('pk').onchange=render;
run();reset();
window.__claw={S,get H(){return H;}};
}
</script>
</body>
</html>
